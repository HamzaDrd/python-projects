[project]
name = "python-projects"
version = "0.1.0"
description = "Small projects for learning Python"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["projects"]
# each project folder is independent, so `from main import ...` works per project
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
